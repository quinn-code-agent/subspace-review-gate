<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subspace Relay Review</title>
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div class="app">
    <main class="stage" id="stage">
      <div id="artifact"></div>
    </main>
    <button type="button" id="handle" class="handle" aria-label="Hide comments panel">›</button>
    <aside class="rail" id="rail">
      <div class="rail-scroll">
        <div class="rail-head"><span class="section">Feedback</span><span class="dim" id="count">0</span></div>
        <div class="identity-chip" id="identity-chip"></div>
        <div id="compose" hidden></div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty">Select text to comment on it</div>
      </div>
      <div class="rail-foot" id="rail-foot"></div>
    </aside>
  </div>
</body>
</html>
